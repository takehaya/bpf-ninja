name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-test:
    name: Unit Tests (${{ matrix.config.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: static, cgo: "0", goflags: ""}
          - {name: enable_libpcap, cgo: "1", goflags: "-tags=enable_libpcap"}
    env:
      CGO_ENABLED: ${{ matrix.config.cgo }}
      GOFLAGS: ${{ matrix.config.goflags }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y clang

      - name: Install libpcap-dev for legacy filters
        if: matrix.config.name == 'enable_libpcap'
        run: sudo apt-get install -y libpcap-dev

      - name: Build
        run: go build -o bpf-ninja ./cmd/bpf-ninja/

      - name: Vet
        run: go vet ./...

      - name: Unit Tests
        run: go test ./...

      # The CLI tests build the root command many times; a second,
      # shuffled pass catches state that leaks from one run into the next.
      - name: CLI Tests twice
        run: go test -count=2 -shuffle=on ./cmd/bpf-ninja

      - name: Script Tests
        run: python3 -m unittest discover -s scripts/tests

      # Short fuzz gate (30s × 2 targets) to extend the seed corpus
      # past `go test`'s seed-only run. Caches a fail to ./fuzz/ —
      # any reproducer surfaces in the next pre-merge cycle. The
      # cap is per-target so the total CI minute cost stays bounded.
      - name: Fuzz (compile)
        run: go test -run=^$ -fuzz=^FuzzCompile$ -fuzztime=30s ./pkg/kunai/

      - name: Fuzz (lexer)
        run: go test -run=^$ -fuzz=^FuzzLexNext$ -fuzztime=30s ./pkg/kunai/lexer/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "1"
      GOFLAGS: "-tags=enable_libpcap"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpcap-dev libbpf-dev clang tcpdump gcc-multilib
          sudo apt-get install -y linux-tools-generic
          # The /usr/sbin wrapper requires tools matching the runner kernel.
          # Use the packaged binary directly, including on Azure kernels.
          for tool in /usr/lib/linux-tools/*/bpftool; do
            if "$tool" version; then
              sudo install -m 755 "$tool" /usr/local/sbin/bpftool
              break
            fi
          done
          sudo bpftool version

      - name: Build
        run: go build -o bpf-ninja ./cmd/bpf-ninja/

      - name: Build inject observer examples
        run: ./examples/inject-observers/build.sh

      - name: Mount bpffs for privileged tests
        run: mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf

      - name: Privileged Go suites (required datapath and attach coverage)
        run: make test-bpf

      - name: Build supervisor integration tests and map types loader
        run: |
          CGO_ENABLED=0 GOFLAGS= go test -c -tags integration -o syscallhook.test ./pkg/syscallhook
          CGO_ENABLED=0 GOFLAGS= go build -o loader ./pkg/syscallhook/testdata/maptypes/loader.go
          clang -O2 -g -target bpf -c pkg/syscallhook/testdata/maptypes/program.c -o program.o

      - name: Privileged supervisor integration tests (no skips)
        run: sudo env SYSCALLHOOK_MAP_TYPES_ELF=./program.o /usr/bin/python3 scripts/test/privileged.py --syscallhook-binary ./syscallhook.test

      - name: Load inject observer examples
        run: sudo ./examples/inject-observers/verify.sh --load-only

      - name: Integration Tests
        run: sudo env CI=true scripts/test/run_tests.sh

      - name: Documentation capture examples
        run: sudo bash scripts/test/docs-capture.sh
