---
name: BPF load test

on:
  push:
    branches: [main]
    paths:
      - 'go.*'
      - '**.go'
      - '**.p4'
      - '.github/workflows/bpf_load_test.yaml'
      - 'scripts/test/**'
      - 'Makefile'
  pull_request:
    paths:
      - 'go.*'
      - '**.go'
      - '**.p4'
      - '.github/workflows/bpf_load_test.yaml'
      - 'scripts/test/**'
      - 'Makefile'

jobs:
  bpf-load-test:
    name: BPF load test (kernel ${{ matrix.kernel }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kernel: ["6.6", "6.7", "6.8-rc4", "6.8", "6.9", "6.10", "6.11", "6.12-rc2", "6.12"]
    permissions:
      contents: read
      packages: read
    env:
      VIMTO_VERSION: v0.4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod

      - name: Install libpcap-dev
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpcap-dev libbpf-dev clang gcc-multilib

      - name: Cache vimto binary
        uses: actions/cache@v6
        id: vimto-cache
        with:
          path: ~/go/bin/vimto
          key: vimto-bin-${{ runner.os }}-${{ env.VIMTO_VERSION }}

      - name: Install vimto
        if: steps.vimto-cache.outputs.cache-hit != 'true'
        run: CGO_ENABLED=0 go install lmb.io/vimto@${{ env.VIMTO_VERSION }}

      - name: Install crane
        run: CGO_ENABLED=0 go install github.com/google/go-containerregistry/cmd/crane@v0.20.7

      - name: Cache QEMU packages
        uses: actions/cache@v6
        id: qemu-cache
        with:
          path: ~/.cache/qemu-debs
          # The .debs belong to the runner image; change this with runs-on.
          key: qemu-debs-ubuntu-26.04-${{ runner.arch }}

      - name: Install QEMU
        run: |
          if [ -d ~/.cache/qemu-debs ]; then
            sudo cp ~/.cache/qemu-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          mkdir -p ~/.cache/qemu-debs
          cp /var/cache/apt/archives/qemu*.deb ~/.cache/qemu-debs/ 2>/dev/null || true

      - name: Enable KVM
        run: sudo chmod 0666 /dev/kvm

      - name: Cache kernel images
        uses: actions/cache@v6
        with:
          path: ~/.cache/vimto
          key: vimto-kernel-${{ matrix.kernel }}

      - name: Pre-fetch kernel image
        run: |
          REF="ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}"
          HASH=$(echo -n "$REF" | sha256sum | cut -d' ' -f1)
          DIR="$HOME/.cache/vimto/${HASH}/contents"
          if [ ! -d "$DIR" ]; then
            echo "Fetching $REF (authenticated)..."
            crane auth login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
            mkdir -p "$DIR"
            crane export "$REF" - | tar -xf - -C "$DIR"
          else
            echo "Cache hit: $DIR"
          fi

      - name: Run verifier stats
        run: |
          mkdir -p vlogs
          vimto -sudo -kernel :${{ matrix.kernel }} -- env KUNAI_VERIFIER_DUMP=$PWD/vlogs go test -count=1 -v -run TestVerifierStats ./pkg/kunai/dsltest 2>&1 | tee vstat.log
          grep -ho 'VSTAT-BASELINE.*' vstat.log
          for f in vlogs/*.log; do echo "$f $(wc -c < "$f") limit=$(grep -ci 'limit' "$f")"; done
          tar czf vlogs.tgz vlogs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vlogs-${{ matrix.kernel }}
          path: |
            vlogs.tgz
            vstat.log
